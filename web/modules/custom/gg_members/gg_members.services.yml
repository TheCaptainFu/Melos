services:
  gg_members.manager:
    class: Drupal\gg_members\MemberManager
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@file.usage'
      - '@config.factory'
  gg_members.stats:
    class: Drupal\gg_members\MemberStats
    arguments:
      - '@database'
      - '@config.factory'
      - '@gg_members.manager'
  gg_members.expenses:
    class: Drupal\gg_members\ExpenseManager
    arguments:
      - '@database'
      - '@datetime.time'
      - '@current_user'
      - '@config.factory'
      - '@lock'
